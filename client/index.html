<!DOCTYPE html>
<html>

<head>

    <!-- Website title -->
    <title>Lomi Freelance</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <h1>🍋 Lomi Freelance</h1>

        <p>
            Remote jobs for beginners worldwide
        </p>

    </header>


    <main>

    <h2>Latest Remote Jobs</h2>


    <!-- Search input -->
    <input 
        id="search"
        type="text"
        placeholder="Search jobs..."
    >


    <!-- Category filter -->
    <select id="category">

        <option value="all">
            All Categories
        </option>

        <option value="assistant">
            Assistant
        </option>

        <option value="data">
            Data Entry
        </option>

        <option value="writing">
            Writing
        </option>

        <option value="developer">
            Developer
        </option>

    </select>


    <!-- Jobs display area -->
    <div id="jobs-container">

        Loading jobs...

    </div>


</main>


    <!-- Connect JavaScript -->
    <script src="app.js"></script>

</body>

</html>
